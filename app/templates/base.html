<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Fraude Interno{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><div class="eyebrow">UMG · SEGURIDAD Y AUDITORÍA DE SISTEMAS</div><h1>Monitoreo de Fraude Interno</h1><div class="subtitle">Demo académica · Datos 100 % sintéticos y seudonimizados</div></div><div class="rolebox"><label>Vista por rol</label><select onchange="location.href=this.value"><option>{{ role_name }}</option>{% for k,v in roles.items() %}{% if k != role_id %}<option value="{{ request.url.path }}?rol={{ k }}">{{ v }}</option>{% endif %}{% endfor %}</select></div></header>
<nav><a class="{% if active=='dashboard' %}active{% endif %}" href="/?rol={{role_id}}">Dashboard</a><a class="{% if active=='escenarios' %}active{% endif %}" href="/escenarios?rol={{role_id}}">Pruebas</a><a class="{% if active=='reglas' %}active{% endif %}" href="/reglas?rol={{role_id}}">Reglas</a><a class="{% if active=='bitacora' %}active{% endif %}" href="/bitacora?rol={{role_id}}">Bitácora</a></nav>
<main>{% block content %}{% endblock %}</main><footer>Una alerta representa una señal para revisión humana; no constituye una conclusión sobre una persona.</footer></body></html>
